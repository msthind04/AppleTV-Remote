name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Conformance tests are the meaningful gate: they check the crypto and
      # wire format byte-for-byte against reference vectors.
      - name: Protocol conformance tests
        run: ./gradlew :protocol:test

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: protocol/build/reports/tests/test/
