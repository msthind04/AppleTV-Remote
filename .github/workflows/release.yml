name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # A per-run self-signed keystore: the artifact is installable and R8
      # keeps it at a few MB. Signature differs between runs, so updating an
      # existing install needs one uninstall first.
      - name: Generate CI signing keystore
        run: |
          keytool -genkeypair -v -keystore app/ci-release.keystore \
            -alias atvremote -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass ci-build-pass -keypass ci-build-pass \
            -dname "CN=Apple TV Remote CI"
          printf 'storeFile=ci-release.keystore\nstorePassword=ci-build-pass\nkeyAlias=atvremote\nkeyPassword=ci-build-pass\n' > keystore.properties

      - name: Build release APK (R8-minified)
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk AppleTV-Remote-${GITHUB_REF_NAME}.apk

      - name: Attach APK to the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: AppleTV-Remote-*.apk
          generate_release_notes: true
